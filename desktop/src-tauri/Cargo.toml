[package]
name = "livetask-desktop"
version = "1.0.0"
description = "A minimal LiveTask desktop client"
authors = ["Masood"]
edition = "2021"

[lib]
name = "livetask_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
